<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WANOS ROBERT</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#05051a,#10105c,#001f35);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.container{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#00eaff,#7b00ff);
  box-shadow:0 0 30px #00eaff;
  font-size:25px;
  font-weight:bold;
}

h1{
  margin:18px 0 5px;
  font-size:32px;
  color:#00eaff;
  text-shadow:0 0 15px #00eaff;
}

.subtitle{
  color:#ddd;
  margin-bottom:25px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:17px;
  margin:13px 0;
  border-radius:15px;
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.10);
  box-shadow:0 5px 20px rgba(0,0,0,.3);
  transition:.2s;
}

.btn:hover{
  transform:scale(1.03);
}

.icon{
  font-size:25px;
}

.whatsapp{background:linear-gradient(90deg,#08c76a,#00e676);}
.facebook{background:linear-gradient(90deg,#1877f2,#4267b2);}
.call{background:linear-gradient(90deg,#ff9800,#ff5722);}
.cashier{background:linear-gradient(90deg,#8e2de2,#4a00e0);}

.footer{
  margin-top:25px;
  color:#aaa;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">WR</div>

  <h1>WANOS ROBERT</h1>

  <div class="subtitle">
    خدماتك الرقمية بين يديك 📱
  </div>

  <a class="btn whatsapp"
     href="https://wa.me/qr/F5KUNEW4FQ5KI1"
     target="_blank">
    <span class="icon">💬</span>
    واتساب
  </a>

  <a class="btn facebook"
     href="https://www.facebook.com/share/1CEk2DodXx/"
     target="_blank">
    <span class="icon">📘</span>
    فيسبوك
  </a>

  <a class="btn call"
     href="tel:0991925521">
    <span class="icon">📞</span>
    اتصال مباشر
  </a>

  <a class="btn cashier"
     href="https://forms.gle/homyzdpdyozjUccg8"
     target="_blank">
    <span class="icon">💳</span>
    التسجيل كاشير
  </a>

  <div class="footer">
    © WANOS ROBERT — جميع الحقوق محفوظة
  </div>

</div>

</body>
</html>
